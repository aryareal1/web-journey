<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Contoh Video di HTML</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <h1>Video Subtitle</h1>
    <video controls>
      <source src="sample.webm" type="video/webm" />
      <source src="sample.mp4" type="video/mp4" />
      <track
        src="sample.id.vtt"
        kind="subtitles"
        srclang="id"
        label="Indonesia"
      />
      <track src="sample.jp.vtt" kind="subtitles" srclang="jp" label="Jepang" />
    </video>
  </body>
</html>
