<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan Width & Height</title>
    <style>
      .box {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .box-1 {
        width: 200px;
        height: 200px;
        background-color: yellowgreen;
      }
      .box-2 {
        width: 50%;
        height: 150px;
        background-color: skyblue;
      }
      .box-3 {
        width: 80vw;
        height: 30vh;
        background-color: violet;
      }
    </style>
  </head>
  <body>
    <div class="box box-1">200px x 200px</div>
    <div class="box box-2">50% x 150px</div>
    <div class="box box-3">80vw x 30vh</div>
  </body>
</html>
