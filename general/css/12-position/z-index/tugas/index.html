<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tugas Z-Index</title>
    <style>
      img {
        width: 300px;
        height: 300px;
        object-fit: cover;
        border-radius: 5px;
        box-shadow: 1px 1px 10px rgba(0, 0, 0, 0.1);
        transition: all 0.3s ease;
      }

      img:hover {
        z-index: 10;
        transform: scale(1.05);
      }

      .img-1 {
        position: absolute;
        top: 30px;
        left: 30px;
        z-index: 2;
      }

      .img-2 {
        position: absolute;
        top: 70px;
        left: 100px;
        z-index: 1;
      }

      .img-3 {
        position: absolute;
        top: 110px;
        left: 170px;
      }
    </style>
  </head>
  <body>
    <img
      class="img-1"
      src="https://static.vecteezy.com/system/resources/previews/046/892/276/non_2x/illustration-of-cute-anime-girl-character-for-design-inspiration-vector.jpg"
      alt="Image 1"
    />
    <img
      class="img-2"
      src="https://i.ytimg.com/vi/hcaQug00LB0/maxresdefault.jpg"
      alt="Image 2"
    />
    <img
      class="img-3"
      src="https://geometrydashfullversion.io/cache/data/image/game/geometry-dash/geometry-game-m200x200.webp"
      alt="Image 3"
    />
  </body>
</html>
