<!doctype html>
<html>
  <head>
    <style>
      .fixed {
        position: fixed;
        padding: 10px;
        top: 50%;
        background-color: #f5f5f5;
        border: 1px solid #e4dfdb;
        border-radius: 8px;
      }

      .left {
        left: 10px;
      }

      .right {
        right: 10px;
      }
    </style>
  </head>
  <body>
    <div class="fixed left">Fixed Left</div>
    <div class="fixed right">Fixed Right</div>
  </body>
</html>
