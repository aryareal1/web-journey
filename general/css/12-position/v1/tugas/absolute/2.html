<!doctype html>
<html>
  <head>
    <style>
      .container {
        position: relative;
        width: 300px;
        height: 300px;
        background-color: lightgray;
      }
      .box {
        position: absolute;
        top: 50px;
        left: 50px;
        background-color: coral;
        width: 100px;
        height: 100px;
      }
      .box-1 {
        position: absolute;
        top: 170px;
        left: 20px;
        background-color: yellow;
        width: 100px;
        height: 100px;
      }
      .box-2 {
        position: absolute;
        bottom: 90px;
        right: 40px;
        background-color: green;
        width: 100px;
        height: 100px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box">Absolute</div>
      <div class="box-1"></div>
      <div class="box-2"></div>
    </div>
  </body>
</html>
