<!doctype html>
<html>
  <head>
    <style>
      .container {
        position: relative;
        width: 300px;
        height: 300px;
        background-color: lightgray;
      }
      .box {
        position: absolute;
        left: 10px;
        top: 10px;
        background-color: coral;
        width: 100px;
        height: 100px;
      }
      .box-1 {
        position: absolute;
        right: 10px;
        top: 10px;
        background-color: yellow;
        width: 100px;
        height: 100px;
      }
      .box-2 {
        position: absolute;
        right: 10px;
        bottom: 10px;
        background-color: green;
        width: 100px;
        height: 100px;
      }
      .box-3 {
        position: absolute;
        left: 10px;
        bottom: 10px;
        background-color: blue;
        width: 100px;
        height: 100px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box"></div>
      <div class="box-1"></div>
      <div class="box-2"></div>
      <div class="box-3"></div>
    </div>
  </body>
</html>
