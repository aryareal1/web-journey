<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Decoration</title>
    <style>
      h1 {
        text-decoration: overline line-through;
        text-decoration-color: blueviolet;
      }
      p {
        line-height: 1.5;
      }
      .upperline {
        text-decoration: overline;
        text-decoration-style: dashed;
      }
      .underline {
        text-decoration: underline;
      }
      .strike {
        text-decoration: line-through;
        text-decoration-style: wavy;
      }
    </style>
  </head>
  <body>
    <h1>Contoh Text Decoration</h1>
    <p>
      <span class="underline">Ini Teks dengan dekorasi garis bawah</span>. Ini
      teks normal, tanpa dekorasi apapun. Ini teks tanpa dekorasi. Ini teks
      <span class="strike">yang dicoret</span>.
      <span class="upperline">Ini teks dengan dekorasi garis di atas.</span>
    </p>
  </body>
</html>
